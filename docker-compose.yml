# ===== SOAR 平台一键启动编排 =====
# 启动：docker compose up -d
# 查看日志：docker compose logs -f
# 停止（保留数据）：docker compose stop
# 停止并删除容器（保留数据卷）：docker compose down
# ⚠️ 切勿使用 docker compose down -v，会清空所有数据！
# 数据卷名已固定为 soar_pgdata / soar_uploads，不受项目目录名影响。
services:
  # ---------- 数据库：PostgreSQL ----------
  postgres:
    image: postgres:15
    container_name: soar-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-soar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------- 缓存与消息中间件：Redis ----------
  redis:
    image: redis:7.4-alpine
    container_name: soar-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-12345678}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-12345678}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---------- 后端 API：FastAPI ----------
  backend:
    image: soar-backend:latest
    container_name: soar-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-soar}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-soar}
      REDIS_URL: redis://:${REDIS_PASSWORD:-12345678}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-12345678}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-12345678}@redis:6379/1
      JWT_SECRET: ${JWT_SECRET:-soar-dev-secret-change-me-in-production-please}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
      - //var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # ---------- 异步任务：Celery Worker ----------
  worker:
    image: soar-backend:latest
    container_name: soar-worker
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-soar}
      REDIS_URL: redis://:${REDIS_PASSWORD:-12345678}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-12345678}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-12345678}@redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    entrypoint: []
    command: ["celery", "-A", "app.core.celery_app", "worker", "-l", "info"]
    restart: unless-stopped

  # ---------- 定时任务调度：Celery Beat ----------
  beat:
    image: soar-backend:latest
    container_name: soar-beat
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-soar}
      REDIS_URL: redis://:${REDIS_PASSWORD:-12345678}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-12345678}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-12345678}@redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    entrypoint: []
    command: ["celery", "-A", "app.core.celery_app", "beat", "-l", "info"]
    restart: unless-stopped

  # ---------- 前端：React + Nginx ----------
  frontend:
    image: soar-frontend:latest
    container_name: soar-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
    name: soaragent_pgdata
  uploads:
    name: soaragent_uploads
  backups:
    name: soaragent_backups
