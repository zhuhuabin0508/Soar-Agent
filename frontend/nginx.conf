server {
    listen 80;
    server_name _;

    # 允许大文件上传（知识库文档、知识库导入等），默认仅 1MB 会导致 413
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # 精确匹配 SPA 路由 /assets（资产管理页面）
    # 避免与 Vite 构建产物目录 /assets/（JS/CSS 打包文件）冲突：
    # 不加此块时，try_files 会把 /assets 匹配到真实目录，返回 403/404 而非 SPA 回退
    # 使用 = 精确匹配，仅拦截 /assets 和 /assets/，不影响 /assets/index-xxx.js 等静态资源
    location = /assets {
        try_files /index.html =404;
    }
    location = /assets/ {
        try_files /index.html =404;
    }

    # SPA 回退：所有未匹配静态资源的路由返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理：转发至后端 FastAPI 容器
    # 注意：proxy_pass 末尾不带斜杠，保留 /api 前缀原样转发
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传/解析（如 Excel/PDF）可能耗时较长，放宽超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;  # 流式转发，避免大请求体先缓存到磁盘

        # ===== SSE 流式输出关键配置 =====
        proxy_buffering off;           # 关闭响应缓冲，让 SSE 事件实时推送
        proxy_cache off;               # 关闭缓存
        proxy_http_version 1.1;        # SSE 需要 HTTP/1.1 支持分块传输
        proxy_set_header Connection "";  # 清除 Connection 头，避免连接被提前关闭
        chunked_transfer_encoding on;  # 启用分块传输编码
    }

    # 静态资源缓存（1 天）
    location ~* \.(js|css|png|jpg|svg)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }
}
