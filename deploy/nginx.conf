# =============================================================================
# SOAR 平台 — 生产 Nginx 配置（入库版本化）
#
# 架构：
#   浏览器 → Nginx(:8080, HTTPS) ── 托管 /opt/soar-src/frontend/dist
#                                └─ /api/ 与 /ws/ ──> uvicorn(127.0.0.1:8001, 纯 HTTP)
#
# CSP 策略说明（AppScan 复测整改第四轮，2026-09-17）：
#   - script-src 仅保留 'nonce-$request_id' + 'strict-dynamic'：
#     · 'unsafe-inline' 与 https:/http: 回退 token → AppScan 报「内联脚本不安全回退」
#       「过于宽松的允许列表回退」中危（第二轮教训，第三轮已移除）
#     · 'self' → checkScriptAllowlistBypass 对其无条件报「脚本白名单配置的绕过」中危，
#       且被 strict-dynamic 忽略后触发参考级「浏览器忽略的指令」（第三轮教训，本轮移除）
#   - strict-dynamic 存在时源表达式本就不参与 CSP3 匹配，移除 'self' 对现代浏览器零影响
#     （Chrome 53+/Edge 79+/Firefox 52+/Safari 15.4+）；代价仅 2020 前 Edge Legacy、
#     Safari<15.4 懒加载路由不可用，内网现代浏览器环境无感
#   - csp_evaluator 1.1.8（DEFAULT+STRICTCSP 全量检查）实测：无 HIGH/MEDIUM/MEDIUM_MAYBE 级发现
#   - require-trusted-types-for 'script' 强制可信类型，前端垫片注册 default 直通策略
#   - style-src 保持 'self'：前端零内联样式依赖（theme-init 外置 + CSSOM 垫片）
#   - object-src 'none' / frame-ancestors 'none'：系统无 object/embed/自嵌 iframe，
#     'self' 会触发 object 绕过检查（MEDIUM_MAYBE），保持 'none' 零成本最严
# =============================================================================

# HTTP → HTTPS 强制跳转（HSTS 生效前提）
server {
    listen 80;
    server_name _;
    return 301 https://$host:8080$request_uri;
}

# HTTPS 生产入口：TLS 终止在此完成
server {
    listen 8080 ssl;
    server_name _;

    # 隐藏 Server 头中的版本号；如需彻底移除 Server 头，
    # 安装 headers-more 模块后取消下方 more_clear_headers 注释
    server_tokens off;
    # more_clear_headers 'Server';

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # CSP 统一定义（server 级 + 静态资源 location 共用，保证所有响应头一致）
    # nonce 取 $request_id（32 位随机 hex，每请求唯一且不可预测）
    set $csp_nonce $request_id;
    set $csp "default-src 'self'; script-src 'nonce-$csp_nonce' 'strict-dynamic'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script';";

    # 将 nonce 动态注入 index.html 中所有 <script> 标签（依赖 http_sub 模块；
    # 本 server 未启用 gzip，HTML 以明文响应，sub_filter 可正常改写）
    sub_filter '<script' '<script nonce="$csp_nonce"';
    sub_filter_once off;
    sub_filter_types text/html;

    # 统一安全响应头（/、/api/、/ws/ 全部继承本组头）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp always;
    # 页面与 API 响应禁止浏览器/代理缓存（防 SSL 页面敏感信息落盘，AppScan「可高速缓存的 SSL 页面」）
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;

    client_max_body_size 50M;

    root /opt/soar-src/frontend/dist;
    index index.html;

    # 敏感路径一律返回 404：403 会向扫描器证实资源存在（AppScan「检测到隐藏目录」）
    location ~* /\.(git|env|svn|hg|htaccess) { return 404; }
    location ~* /(adpassword|password|secret|credential|\.env).*\.(txt|json|log|bak|env)$ { return 404; }
    location ~* \.(bak|old|orig)$ { return 404; }
    location ~* ^/(src|node_modules|public|tests?)/ { return 404; }

    # ^~ 优先于静态后缀正则，避免 /api/*.png 附件被当成 dist 静态文件
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /assets {
        try_files /index.html =404;
    }
    location = /assets/ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源：本 location 有自己的缓存头，nginx 规则是 location 内一旦出现
    # add_header，server 级头全部不再继承，因此安全头在此完整重复声明；
    # 缓存策略为静态资源可缓存（覆盖 server 级 no-store）
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;
    }
}
