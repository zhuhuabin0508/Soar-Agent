# =============================================================================
# SOAR 平台 — 生产 Nginx 配置（入库版本化）
#
# 架构：
#   浏览器 → Nginx(:8080, HTTPS) ── 托管 /opt/soar-src/frontend/dist
#                                └─ /api/ 与 /ws/ ──> uvicorn(127.0.0.1:8001, 纯 HTTP)
# =============================================================================

# HTTP → HTTPS 强制跳转（HSTS 生效前提）
server {
    listen 80;
    server_name _;
    return 301 https://$host:8080$request_uri;
}

# HTTPS 生产入口：TLS 终止在此完成
server {
    listen 8080 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'nonce-$cspNonce' 'strict-dynamic'; style-src 'self' 'unsafe-hashes' 'sha256-l5WDRoLwkLMXqsUYbgQSl3CzRuEjAhLON6HBa+Ix+eg='; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' data: blob:; frame-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    set $cspNonce $request_id;            # 不写死固定值，取每请求唯一 ID
    sub_filter_once off;
    sub_filter_types text/html;           # 不用 *，只处理 HTML，避免污染 API 的 JSON 响应
    sub_filter '<script' '<script nonce=$cspNonce ';


    client_max_body_size 50M;

    root /opt/soar-src/frontend/dist;
    index index.html;

    location ~* /\.(git|env|svn|hg|htaccess) { deny all; }
    location ~* /(adpassword|password|secret|credential|\.env).*\.(txt|json|log|bak|env)$ { deny all; }
    location ~* \.(bak|old|orig)$ { deny all; }
    location ~* ^/(src|node_modules|public|tests?)/ { deny all; }

    # ^~ 优先于静态后缀正则，避免 /api/*.png 附件被当成 dist 静态文件
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /assets {
        try_files /index.html =404;
    }
    location = /assets/ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
        # nginx 规则：location 内一旦出现 add_header，server 级安全头不再继承。
        # 必须在此重复声明，否则静态资源响应缺失 CSP/HSTS 等头，会被扫描器报"响应头缺失"
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    }
}
