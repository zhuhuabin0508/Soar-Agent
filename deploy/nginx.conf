# =============================================================================
# SOAR 平台 — 生产 Nginx 配置（入库版本化）
#
# 作用：对外 8080 端口 HTTPS 终止 + 托管 vite build 产物 + 反代后端 API/WebSocket。
#       彻底下线生产 Vite dev server（大量中高危漏洞的根因）。
#
# 架构：
#   浏览器 → Nginx(:8080, HTTPS) ── 托管 dist/ 静态文件
#                                └─ /api/ 与 /ws/ ──> uvicorn(127.0.0.1:8081, 纯 HTTP)
#
# 部署：证书放入服务器固定路径 /etc/nginx/ssl/（不入库，构建时手动放置/生成），
#       生成命令：
#         openssl req -x509 -newkey rsa:2048 -keyout /etc/nginx/ssl/server.key \
#           -out /etc/nginx/ssl/server.crt -days 3650 -nodes -subj "/CN=10.223.132.41"
#       若沿用现有 Vite 自签证书 frontend/certs/，将其复制到 /etc/nginx/ssl/ 即可。
# =============================================================================

# HTTP → HTTPS 强制跳转（HSTS 生效前提，消除"可缓存 SSL 页面"等低危项）
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS 生产入口：TLS 终止在此完成
server {
    listen 8080 ssl;
    server_name _;

    # TLS 证书（服务器固定路径，不入库；见文件头生成命令）
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # ---- 任务二：收紧密码套件 ----
    # 仅 TLS 1.2 / 1.3（禁用 TLS 1.0/1.1）
    ssl_protocols TLSv1.2 TLSv1.3;
    # 仅 ECDHE 套件：无 TLS_RSA_*（消除 ROBOT + 保证前向保密 PFS）、无 SHA-1、无 CBC
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # ---- 任务四：安全响应头 ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' wss:; script-src 'self';" always;

    # 大文件上传（知识库文档/导入）
    client_max_body_size 50M;

    root /usr/share/nginx/html;   # 生产部署时 dist/ 内容放置于此
    index index.html;

    # ---- 任务三：敏感文件封堵（防御纵深）----
    # 版本控制 / 环境变量 / 密钥 / 备份
    location ~* /\.(git|env|svn|hg|htaccess) { deny all; }
    location ~* /(adpassword|password|secret|credential|\.env).*\.(txt|json|log|bak|env)$ { deny all; }
    location ~* \.(bak|old|orig)$ { deny all; }
    # 禁止直接访问源码 / 构建元数据（生产仅暴露 dist 静态产物）
    location ~* ^/(src|node_modules|public|tests?)/ { deny all; }

    # SPA 路由回退（刷新非根路径不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 后端 API 反向代理（纯 HTTP，关闭 TLS 前向到 uvicorn）----
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 大文件上传/解析可能耗时较长，放宽超时
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # ---- WebSocket（前端连接 wss://10.223.132.41:8080/ws/...）----
    location /ws/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;   # WS 长连接
        proxy_send_timeout 3600s;
    }

    # 静态资源缓存（1 天）
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }
}
